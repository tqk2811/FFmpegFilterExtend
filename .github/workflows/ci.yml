name: CI

on:
  push:
    branches: [main, master]
    # Documentation only: nothing to build or test.
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Software Vulkan driver (lavapipe)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo fmt --all -- --check
      - run: cargo clippy --release --all-targets -- -D warnings
      # GPU tests skip themselves when the runner has no usable adapter. Linux pins the backend
      # it really has (lavapipe); --nocapture shows each "skipping: ..." line, which libtest
      # otherwise hides for a passing test. Windows runs no tests: WARP, its only adapter, runs
      # shaders on the CPU for many minutes, so the D3D12 tests run on a local GPU instead.
      - name: cargo test (Vulkan)
        if: runner.os == 'Linux'
        run: cargo test --release -- --nocapture
        env:
          GPUFX_TEST_BACKEND: vulkan
      - name: cargo test
        if: runner.os == 'macOS'
        run: cargo test --release
      - name: Check every example shader
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/pack-effects.sh --check

  # Licenses of every crate the bundles link (deny.toml): no GPL or unknown license.
  licenses:
    name: Crate licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  # Prebuilt shared FFmpeg 9.0 (tqk2811/FFmpegBuild) with only libavfilter rebuilt:
  # gpufx plus every filter libavfilter builds on its own. A few minutes each.
  ffmpeg-linux64:
    name: FFmpeg 9.0 prebuilt + gpufx (linux64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux64
      - name: Tools
        run: |
          sudo apt-get update
          # The distro ffmpeg only makes test clips: the bundle has no video sources.
          sudo apt-get install -y mesa-vulkan-drivers ffmpeg patchelf nasm
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: REQUIRE_LICENSES=1 scripts/build-prebuilt.sh linux64
      - name: Logs of the failed build
        if: failure()
        run: tail -n 100 build/prebuilt-linux64/*.log || true
      - name: Run effects in ffmpeg
        run: scripts/test-bundle.sh dist/linux64
      # tar keeps the exec bits and the .so symlinks that a plain artifact would lose.
      - run: tar -C dist -cJf ffmpeg-gpufx-linux64.tar.xz linux64
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-gpufx-linux64
          path: ffmpeg-gpufx-linux64.tar.xz
          retention-days: 14

  ffmpeg-win64:
    name: FFmpeg 9.0 prebuilt + gpufx (win64, cross-compiled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: win64
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nasm ffmpeg
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # Building without D3D12/D3D11 frames would make the Windows tests meaningless.
      - run: REQUIRE_D3D=1 REQUIRE_LICENSES=1 scripts/build-prebuilt.sh win64
      - name: Logs of the failed build
        if: failure()
        run: tail -n 100 build/prebuilt-win64/*.log || true
      - name: Test clips for the Windows job
        run: TEST_CLIPS_ONLY=1 scripts/test-bundle.sh dist/win64 build/test-clips
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-gpufx-win64
          path: dist/win64
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: test-clips
          path: build/test-clips
          retention-days: 1

  ffmpeg-windows:
    name: FFmpeg 9.0 prebuilt + gpufx (win64, run on Windows)
    needs: ffmpeg-win64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-gpufx-win64
          path: dist/win64
      - uses: actions/download-artifact@v4
        with:
          name: test-clips
          path: build/test-clips
      - name: Run effects in ffmpeg.exe
        shell: bash
        # The D3D12/D3D11 frame tests run only where FFmpeg can create a d3d12va/d3d11va
        # device (e.g. a GPU runner); on hosted WARP-only runners they are skipped with a warning
        # and the job passes without D3D coverage. REQUIRE_D3D=1 fails
        # when a device exists but gpufx rejects or skips it. gpufx outputs GPU frames only, so the
        # effect tests need FFmpeg's Vulkan device: without one (hosted runners) they are skipped
        # with a warning too, and only the device-free checks run here.
        run: REQUIRE_D3D=1 scripts/test-bundle.sh dist/win64 build/test-clips

  # FFmpeg 9.0 from the external/FFmpeg submodule with gpufx and VideoToolbox (no prebuilt
  # macOS FFmpeg to swap libavfilter into). Test only: nothing is released.
  ffmpeg-macos:
    name: FFmpeg 9.0 + gpufx (macOS, VideoToolbox frames)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      - name: Tools
        # Homebrew's ffmpeg only makes the test clips.
        run: brew install nasm pkg-config ffmpeg
      - name: Build
        run: |
          set -eu
          W=$PWD/build/macos OUT=$PWD/dist/macos
          scripts/install-libgpufx.sh "$W/prefix"
          # Found through the executable's rpath, wherever the bundle is unpacked.
          install_name_tool -id @rpath/libgpufx.dylib "$W/prefix/lib/libgpufx.dylib"
          rm -rf "$W/ffmpeg" "$OUT" && mkdir -p "$W/ffmpeg" "$OUT/bin"
          tar -C external/FFmpeg --exclude=.git -cf - . | tar -C "$W/ffmpeg" -xf -
          ffmpeg/integrate.sh "$W/ffmpeg"
          cd "$W/ffmpeg"
          # Static FFmpeg libraries; libgpufx.dylib (@rpath) next to the executable.
          PKG_CONFIG_PATH="$W/prefix/lib/pkgconfig" ./configure --disable-doc --disable-debug \
            --disable-ffplay --disable-ffprobe --enable-libgpufx --enable-videotoolbox \
            --extra-ldflags='-Wl,-rpath,@executable_path' \
            > "$W/configure.log" || { tail -20 "$W/configure.log"; exit 1; }
          grep -q '^#define CONFIG_VIDEOTOOLBOX 1' config.h || { echo "configure did not enable VideoToolbox" >&2; exit 1; }
          make -j"$(sysctl -n hw.ncpu)" > "$W/make.log" 2>&1 || { tail -40 "$W/make.log"; exit 1; }
          cp ffmpeg "$W/prefix/lib/libgpufx.dylib" "$OUT/bin/"
          cd - > /dev/null
          scripts/pack-effects.sh -o "$OUT/effects" > /dev/null
      - name: Run effects in ffmpeg
        # gpufx outputs GPU frames: here VideoToolbox frames on Metal (no Vulkan in this
        # build, so those tests are skipped). REQUIRE_VT=1 fails when the VideoToolbox tests
        # are skipped for another reason than a missing device or Metal adapter.
        run: REQUIRE_VT=1 scripts/test-bundle.sh dist/macos

  release:
    # Temporary pre-release of every green build, tagged with the commit id (7 chars).
    # Only the newest KEEP_RELEASES pre-releases are kept. PRs from forks and Dependabot
    # are skipped: their token cannot write releases.
    name: Pre-release (tag = commit id)
    needs: [rust, licenses, ffmpeg-linux64, ffmpeg-windows]
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.event.pull_request.head.sha || github.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # For a PR, github.sha is the temporary merge commit; release the branch head.
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      KEEP_RELEASES: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-gpufx-linux64
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-gpufx-win64
          path: win64
      - name: Package
        run: |
          # Same layout as the linux64 tar.xz: one top folder named after the target.
          zip -qr assets/ffmpeg-gpufx-win64.zip win64
          # All effect packages in one archive.
          (cd win64/effects && zip -qr ../../assets/gpufx-effects.zip .)
          ls -l assets
      - name: Create or update the release
        run: |
          TAG=${SHA::7}
          NOTES="Temporary build of ${SHA} (${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}): prebuilt FFmpeg 9.0 with libavfilter rebuilt for gpufx.
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if OLD=$(gh release view "$TAG" --json targetCommitish -q .targetCommitish 2> /dev/null); then
            # Re-run of the same commit; a different commit with the same short id must not
            # overwrite it.
            [ "$OLD" = "$SHA" ] || { echo "tag $TAG already belongs to $OLD" >&2; exit 1; }
            gh release upload "$TAG" assets/* --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" assets/* --prerelease --target "$SHA" \
              --title "Build $TAG" --notes "$NOTES"
          fi
      - name: Delete old temporary releases
        run: |
          gh release list --limit 200 --json tagName,isPrerelease,name,createdAt \
            -q '[.[] | select(.isPrerelease and (.name | startswith("Build ")))]
                | sort_by(.createdAt) | reverse
                | (env.KEEP_RELEASES | tonumber) as $keep | .[$keep:] | .[].tagName' |
          while read -r tag; do
            echo "delete $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done

  ffmpeg-docker:
    # Full FFmpeg build from source in Docker (build.sh). Slow; run it by hand.
    if: github.event_name == 'workflow_dispatch'
    name: FFmpeg + gpufx full build (${{ matrix.target }}, Docker)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux64, win64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: ./build.sh ${{ matrix.target }}
      - name: Run effects in a filter graph
        if: matrix.target == 'linux64'
        run: |
          sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers ffmpeg
          scripts/test-bundle.sh dist/linux64
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-gpufx-full-${{ matrix.target }}
          path: dist/${{ matrix.target }}
