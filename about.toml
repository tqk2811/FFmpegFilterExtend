# cargo about (scripts/third-party-licenses.sh): the licenses that may be listed in
# THIRD-PARTY-LICENSES-gpufx.txt, in order of preference for crates with a choice
# (e.g. "MIT OR Apache-2.0"). Keep deny.toml's `allow` list in step.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
