[package]
name = "gpufx-core"
description = "Runtime that loads zip effect packages (manifest + WGSL) and runs them on the GPU via wgpu"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true

[dependencies]
wgpu = { version = "30", features = ["naga-ir"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png"] }
thiserror = "2"
naga = { version = "30", features = ["wgsl-in", "glsl-in"] }
sha2 = "0.10"

# Zero-copy Vulkan frames (src/vulkan.rs): the same ash wgpu-hal uses.
[target.'cfg(any(windows, all(unix, not(target_vendor = "apple"))))'.dependencies]
ash = { version = "0.38", default-features = false, features = ["std"] }
