[package]
name = "gpufx-core"
description = "Runtime that loads zip effect packages (manifest + WGSL) and runs them on the GPU via wgpu"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true

[dependencies]
wgpu = { version = "30", features = ["naga-ir", "noop"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png"] }
thiserror = "2"
naga = { version = "30", features = ["wgsl-in", "glsl-in"] }
sha2 = "0.10"

# Zero-copy Vulkan frames (src/vulkan.rs): the same ash wgpu-hal uses.
[target.'cfg(any(windows, all(unix, not(target_vendor = "apple"))))'.dependencies]
ash = { version = "0.38", default-features = false, features = ["std"] }

# D3D12/D3D11 frames (src/d3d12.rs): the windows crate wgpu-hal's DX12 backend uses.
# DXIL shader cache (src/dxil.rs): naga's HLSL writer and dxcompiler.dll, loaded at run time.
[target.'cfg(windows)'.dependencies]
naga = { version = "30", features = ["hlsl-out"] }
libloading = "0.8"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Dxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
] }

# VideoToolbox frames (src/videotoolbox.rs): the objc2 crates wgpu-hal's Metal backend uses.
# CoreVideo is linked directly (three functions).
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes"] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-io-surface",
    "MTLAllocation",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
] }
